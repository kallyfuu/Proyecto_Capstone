<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
  <!-- Lienzo apaisado a proposito: en la diapositiva solo quedan unos 4,8
       pulgadas de alto bajo el titulo, asi que la leyenda y las notas van
       como texto al pie y no dentro de la imagen. De lo contrario hay que
       achicar todo y el texto vuelve a ser ilegible. -->
  <rect x="0" y="0" width="1280" height="500" fill="#FFFFFF"/>

  <!-- ===== cabecera de meses ===== -->
  <rect x="400"  y="10" width="186" height="30" fill="#0F172A"/>
  <rect x="590"  y="10" width="186" height="30" fill="#1E293B"/>
  <rect x="780"  y="10" width="186" height="30" fill="#0F172A"/>
  <rect x="970"  y="10" width="186" height="30" fill="#1E293B"/>
  <rect x="1160" y="10" width="80"  height="30" fill="#0F172A"/>
  <text x="493"  y="31" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">AGOSTO</text>
  <text x="683"  y="31" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">SEPTIEMBRE</text>
  <text x="873"  y="31" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">OCTUBRE</text>
  <text x="1063" y="31" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">NOVIEMBRE</text>
  <text x="1200" y="31" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">DIC.</text>

  <!-- ===== numeros de semana ===== -->
  <g font-size="14" fill="#475569" text-anchor="middle">
    <text x="423"  y="61">S1</text>
    <text x="470"  y="61">S2</text>
    <text x="517"  y="61">S3</text>
    <text x="563"  y="61">S4</text>
    <text x="610"  y="61">S5</text>
    <text x="657"  y="61">S6</text>
    <text x="703"  y="61">S7</text>
    <text x="750"  y="61">S8</text>
    <text x="797"  y="61">S9</text>
    <text x="843"  y="61">S10</text>
    <text x="890"  y="61">S11</text>
    <text x="937"  y="61">S12</text>
    <text x="983"  y="61">S13</text>
    <text x="1030" y="61">S14</text>
    <text x="1077" y="61">S15</text>
    <text x="1123" y="61">S16</text>
    <text x="1170" y="61">S17</text>
    <text x="1217" y="61">S18</text>
  </g>

  <!-- ===== bandas de fila ===== -->
  <rect x="40" y="70"  width="1200" height="56" fill="#F8FAFC"/>
  <rect x="40" y="182" width="1200" height="56" fill="#F8FAFC"/>
  <rect x="40" y="294" width="1200" height="56" fill="#F8FAFC"/>
  <rect x="40" y="406" width="1200" height="56" fill="#F1F5F9"/>

  <!-- ===== rejilla vertical ===== -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="400"  y1="70" x2="400"  y2="462"/>
    <line x1="446"  y1="70" x2="446"  y2="462"/>
    <line x1="493"  y1="70" x2="493"  y2="462"/>
    <line x1="540"  y1="70" x2="540"  y2="462"/>
    <line x1="586"  y1="70" x2="586"  y2="462"/>
    <line x1="633"  y1="70" x2="633"  y2="462"/>
    <line x1="680"  y1="70" x2="680"  y2="462"/>
    <line x1="726"  y1="70" x2="726"  y2="462"/>
    <line x1="773"  y1="70" x2="773"  y2="462"/>
    <line x1="820"  y1="70" x2="820"  y2="462"/>
    <line x1="866"  y1="70" x2="866"  y2="462"/>
    <line x1="913"  y1="70" x2="913"  y2="462"/>
    <line x1="960"  y1="70" x2="960"  y2="462"/>
    <line x1="1006" y1="70" x2="1006" y2="462"/>
    <line x1="1053" y1="70" x2="1053" y2="462"/>
    <line x1="1100" y1="70" x2="1100" y2="462"/>
    <line x1="1146" y1="70" x2="1146" y2="462"/>
    <line x1="1193" y1="70" x2="1193" y2="462"/>
    <line x1="1240" y1="70" x2="1240" y2="462"/>
  </g>

  <!-- ===== filas ===== -->
  <g font-size="17" fill="#0F172A">
    <text x="52" y="104">Fase 1 · Definición y levantamiento</text>
    <text x="52" y="160">Fase 2 · Base de datos y seguridad</text>
    <text x="52" y="216">Fase 3 · Primera entrega funcional</text>
    <text x="52" y="272">Fase 4 · Llavero NFC y portal del cliente</text>
    <text x="52" y="328">Fase 5 · Mejoras pedidas por el docente</text>
    <text x="52" y="384">Fase 6 · Panel, cierre y entrega final</text>
    <text x="52" y="440" font-weight="600">Hitos de la asignatura</text>
  </g>

  <!-- ===== barras ===== -->
  <rect x="422"  y="86"  width="164" height="24" rx="5" fill="#1E8E3E"/>
  <rect x="608"  y="142" width="72"  height="24" rx="5" fill="#1E8E3E"/>
  <rect x="655"  y="198" width="72"  height="24" rx="5" fill="#1E8E3E"/>
  <rect x="748"  y="254" width="72"  height="24" rx="5" fill="#1E8E3E"/>
  <rect x="915"  y="310" width="44"  height="24" rx="5" fill="#1E8E3E"/>
  <rect x="915"  y="366" width="184" height="24" rx="5" fill="#1E8E3E"/>
  <rect x="1101" y="366" width="138" height="24" rx="5" fill="#2E5EAA"/>

  <!-- ===== hitos ===== -->
  <g fill="#1B3B6F">
    <rect x="694"  y="424" width="20" height="20" transform="rotate(45 704 434)"/>
    <rect x="787"  y="424" width="20" height="20" transform="rotate(45 797 434)"/>
    <rect x="927"  y="424" width="20" height="20" transform="rotate(45 937 434)"/>
    <rect x="1207" y="424" width="20" height="20" transform="rotate(45 1217 434)"/>
  </g>
</svg>
