<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mi cuenta</title>
<style>
  :root {
    --azul: #1b3b6f;
    --azul2: #2e5eaa;
    --verde: #1e8e3e;
    --rojo: #c5271d;
    --fondo: #f5f6f9;
    --blanco: #fff;
    --texto: #151a24;
    --tenue: #5f6368;
    --linea: #e2e6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0e1218; --blanco: #161b24; --texto: #e9edf4;
      --tenue: #a5aebe; --linea: #29313f;
      --azul: #8fb3e6; --azul2: #6f9adb;
      --verde: #5cc47a; --rojo: #f07168;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  .hoja { max-width: 30rem; margin: 0 auto; padding: 1.25rem 1.1rem 3rem; }

  .marca {
    display: flex; align-items: center; gap: .6rem;
    color: var(--tenue); font-size: .88rem; margin-bottom: 1.1rem;
  }
  .marca svg { flex: none; }

  .resumen {
    background: linear-gradient(135deg, var(--azul), var(--azul2));
    color: #fff; border-radius: 18px; padding: 1.6rem 1.4rem;
  }
  .resumen .quien { font-size: .9rem; opacity: .85; }
  .resumen .nombre { font-size: 1.35rem; font-weight: 700; margin: .1rem 0 1rem; }
  .resumen .etiqueta { font-size: .85rem; opacity: .85; }
  .resumen .monto {
    font-size: 2.9rem; font-weight: 800; line-height: 1.05;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .resumen .nota { font-size: .85rem; opacity: .85; margin-top: .7rem; }

  h2 {
    font-size: .75rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--tenue);
    margin: 2rem 0 .7rem .2rem;
  }

  .mov {
    background: var(--blanco); border: 1px solid var(--linea);
    border-radius: 12px; padding: .85rem .95rem; margin-bottom: .55rem;
    display: flex; align-items: center; gap: .9rem;
  }
  .mov .txt { flex: 1; min-width: 0; }
  .mov .concepto { font-weight: 600; font-size: .97rem; }
  .mov .fecha { font-size: .8rem; color: var(--tenue); margin-top: .1rem; }
  .mov .monto {
    font-weight: 700; font-size: .97rem; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .fio .monto { color: var(--rojo); }
  .pago .monto { color: var(--verde); }
  .bolita { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .fio .bolita { background: var(--rojo); }
  .pago .bolita { background: var(--verde); }

  .aviso {
    background: var(--blanco); border: 1px solid var(--linea);
    border-radius: 16px; padding: 2.2rem 1.4rem; text-align: center;
    margin-top: 2rem;
  }
  .aviso .icono { font-size: 2.6rem; line-height: 1; }
  .aviso h1 { font-size: 1.15rem; margin: .9rem 0 .4rem; }
  .aviso p { color: var(--tenue); margin: 0; font-size: .95rem; }

  .pie {
    margin-top: 2.2rem; text-align: center;
    font-size: .78rem; color: var(--tenue); line-height: 1.6;
  }

  .cargando { text-align: center; padding: 4rem 0; color: var(--tenue); }
  .giro {
    width: 30px; height: 30px; margin: 0 auto 1rem;
    border: 3px solid var(--linea); border-top-color: var(--azul2);
    border-radius: 50%; animation: girar .9s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .giro { animation: none; } }
</style>
</head>
<body>

<div class="hoja">
  <div class="marca">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/>
    </svg>
    <span>Mi cuenta en el almacén</span>
  </div>

  <div id="contenido">
    <div class="cargando">
      <div class="giro"></div>
      Consultando tu cuenta...
    </div>
  </div>
</div>

<script>
(function () {
  // La llave publishable es PUBLICA por diseño: viaja en cualquier app o
  // pagina que consuma la base. Lo que protege los datos es que el rol anonimo
  // no tiene acceso directo a las tablas; solo puede llamar a esta funcion, y
  // la funcion exige un token valido y activo.
  var URL_BASE = 'https://dezaopfumergwdbxazvi.supabase.co';
  var LLAVE = 'sb_publishable_abjzoT6PmovXzo7moem2Yw_22kvYoYT';

  var caja = document.getElementById('contenido');

  function pesos(monto) {
    var n = Math.abs(Number(monto) || 0);
    return '$' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function escapar(txt) {
    var d = document.createElement('div');
    d.textContent = txt == null ? '' : String(txt);
    return d.innerHTML;
  }

  function fecha(mov) {
    // No damos por sentado el nombre del campo: la funcion puede devolver
    // fecha_local, fecha o synced_at segun como quedo escrita.
    var cruda = mov.fecha_local || mov.fecha || mov.synced_at || mov.created_at;
    if (!cruda) return '';
    var d = new Date(cruda);
    if (isNaN(d)) return '';
    var dd = String(d.getDate()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    return dd + '/' + mm + '/' + d.getFullYear();
  }

  function aviso(icono, titulo, texto) {
    caja.innerHTML =
      '<div class="aviso"><div class="icono">' + icono + '</div>' +
      '<h1>' + escapar(titulo) + '</h1><p>' + escapar(texto) + '</p></div>';
  }

  function pintar(datos) {
    var saldo = Number(datos.saldo) || 0;
    var debe = saldo < 0;

    var encabezado =
      '<div class="resumen">' +
        '<div class="quien">' + escapar(datos.negocio || 'Tu almacén') + '</div>' +
        '<div class="nombre">' + escapar(datos.cliente || '') + '</div>' +
        '<div class="etiqueta">' + (debe ? 'Debes' : 'Tu saldo') + '</div>' +
        '<div class="monto">' + (debe ? pesos(saldo) : (saldo === 0 ? 'Al día' : pesos(saldo) + ' a favor')) + '</div>' +
        '<div class="nota">' +
          (debe ? 'Puedes abonar cuando quieras en el almacén.'
                : 'No tienes deudas pendientes. ¡Gracias!') +
        '</div>' +
      '</div>';

    var movs = Array.isArray(datos.movimientos) ? datos.movimientos : [];
    var lista = '';

    if (movs.length) {
      lista = '<h2>Últimos movimientos</h2>';
      movs.forEach(function (m) {
        var monto = Number(m.monto) || 0;
        var fio = monto < 0;
        lista +=
          '<div class="mov ' + (fio ? 'fio' : 'pago') + '">' +
            '<span class="bolita"></span>' +
            '<div class="txt">' +
              '<div class="concepto">' + escapar(m.concepto || (fio ? 'Fiado' : 'Abono')) + '</div>' +
              '<div class="fecha">' + escapar(fecha(m)) + '</div>' +
            '</div>' +
            '<div class="monto">' + (fio ? '-' : '+') + pesos(monto) + '</div>' +
          '</div>';
      });
    }

    caja.innerHTML = encabezado + lista +
      '<div class="pie">Esta cuenta la lleva tu almacén.<br>' +
      'Si ves algo que no calza, conversa con el almacenero.</div>';
  }

  function parametro(nombre) {
    return new URLSearchParams(window.location.search).get(nombre);
  }

  var token = parametro('token');

  if (!token) {
    aviso('🔑', 'Falta tu enlace',
      'Abre el enlace completo que te dio tu almacén, o acerca tu llavero al teléfono.');
    return;
  }

  fetch(URL_BASE + '/rest/v1/rpc/portal_estado_cuenta', {
    method: 'POST',
    headers: {
      'apikey': LLAVE,
      'Authorization': 'Bearer ' + LLAVE,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_token: token })
  })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function (datos) {
    // La funcion devuelve null cuando el token no existe o fue desactivado,
    // que es lo que pasa si el cliente pierde el llavero y lo damos de baja.
    if (!datos) {
      aviso('🔒', 'Este enlace ya no está activo',
        'Puede que hayas cambiado de llavero. Pídele uno nuevo a tu almacén.');
      return;
    }
    pintar(datos);
  })
  .catch(function () {
    aviso('📡', 'No pudimos consultar tu cuenta',
      'Revisa tu conexión a internet y vuelve a intentarlo.');
  });
})();
</script>
</body>
</html>
